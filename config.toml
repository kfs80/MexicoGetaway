# =====================================================================
#  Mexico Resort Package Finder - settings (v6, CheapCaribbean price-cache API)
# =====================================================================

origins = ["DSM"]

[trip]
lookahead_days    = 210            # 7-month outlook
min_lead_days     = 21             # ignore trips departing sooner than this
min_nights        = 5              # the site offers 3-7 nights; one request per length
max_nights        = 7
depart_weekdays   = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]

[party]
adults            = 2
children          = 0

[pricing]
# What the API's price means. Assumed PER PERSON (typical for CheapCaribbean, includes air).
# Check one deal against the website; if it's already the total for the party, set "total".
unit = "per_person"

[resort_filters]
min_star_rating       = 4.0
require_all_inclusive = true       # uses the site's own All_Inclusive flag
adults_only           = false
# Not available in this data: guest rating and beachfront. The hotel list does have
# Beach_Relaxing / Beach_Swimming scores (scale unverified) if you want a beach proxy later.

[providers]
active = ["cheapcaribbean"]        # more sites = more adapters; see README
pause_seconds = 3.0

[output]
max_packages          = 400        # total deals kept in site/data/packages.json
max_per_resort_nights = 2          # cheapest N departure dates per resort per trip length

[proxy]
# Used only if the direct request to the API is blocked (e.g. from GitHub's servers).
# The API is plain JSON, so no JS rendering is needed, which makes ZenRows cheap here.
enable        = true
premium_proxy = false
