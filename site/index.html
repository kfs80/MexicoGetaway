<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mexico Resort Deals</title>
<style>
  :root { --bg:#f6f7f9; --ink:#1d2433; --mute:#6b7385; --line:#dfe3ea; --accent: #2b5cff;}
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:24px 20px 16px; background:#fff; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 8px; font-size:24px; }
  .sub { color:var(--mute); font-size:14px; }
  
  .controls { padding: 20px; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  select { font:inherit; padding:8px 12px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor: pointer; }
  
  /* Package Grid Layout */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; padding: 0 20px 40px; }
  
  .card { 
      background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; 
      transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; text-decoration: none; color: inherit;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.06); border-color: #c4cad4; }
  
  .card-img { height: 140px; background: #eef1f5; border-bottom: 1px solid var(--line); position: relative; }
  .tag-ai { position: absolute; top: 12px; left: 12px; background: var(--ink); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
  
  .card-body { padding: 16px; flex-grow: 1; }
  .region { font-size: 12px; color: var(--mute); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .resort { font-size: 18px; font-weight: 700; margin: 0 0 8px; line-height: 1.2; }
  .stars { color: #f59e0b; letter-spacing: 2px; margin-bottom: 12px; font-size: 14px;}
  
  .details { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--mute); margin-bottom: 16px; }
  .details div { display: flex; align-items: center; gap: 6px; }
  
  .card-footer { padding: 16px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-end; background: #fafbfc; }
  .price { font-size: 22px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
  .price-sub { font-size: 11px; color: var(--mute); font-weight: 400; }
  .provider { font-size: 12px; font-weight: 600; color: var(--accent); }
  
</style>
</head>
<body>

<header>
  <h1>🌴 Mexico Resort Deals</h1>
  <div class="sub" id="last-updated">Tracking 5-7 night all-inclusive packages out of DSM (Any Departure Day).</div>
</header>

<div class="controls">
  <select id="sort">
    <option value="price">Sort by Price (Low to High)</option>
    <option value="date">Sort by Date (Soonest)</option>
    <option value="rating">Sort by Rating (Highest)</option>
  </select>
  <select id="filter-region">
    <option value="all">All Regions</option>
    <option value="CUN">Cancun / Riviera Maya</option>
    <option value="PVR">Puerto Vallarta</option>
  </select>
</div>

<div class="grid" id="grid">
  <!-- JavaScript will populate cards here -->
</div>

<script>
// Mock injected data (In production, python writes actual JSON here)
const DATA = {
  "generated": new Date().toISOString(),
  "packages": [
    {
        "resort": "Secrets Playa Mujeres Golf & Spa",
        "region": "Cancun",
        "code": "CUN",
        "stars": 4.5,
        "user_rating": 9.2,
        "amenities": ["All-Inclusive", "Beachfront", "Adults Only"],
        "depart_date": "2024-05-14", // Tuesday Departure
        "return_date": "2024-05-20",
        "days": 6,
        "airline": "Delta",
        "price_total": 2900, // Total for 2 adults
        "provider": "CheapCaribbean",
        "url": "#"
    },
    {
        "resort": "Fiesta Americana Puerto Vallarta",
        "region": "Puerto Vallarta",
        "code": "PVR",
        "stars": 4.0,
        "user_rating": 8.5,
        "amenities": ["All-Inclusive", "Beachfront", "Family Friendly"],
        "depart_date": "2024-06-12", // Wednesday Departure
        "return_date": "2024-06-18",
        "days": 6,
        "airline": "American",
        "price_total": 2240, // Total for 2 adults
        "provider": "Expedia",
        "url": "#"
    }
  ]
};

const $ = s => document.querySelector(s);
const renderStars = num => '★'.repeat(Math.floor(num)) + (num % 1 !== 0 ? '½' : '');

function render() {
  const sort = $('#sort').value;
  const region = $('#filter-region').value;
  
  let pkgs = DATA.packages.filter(p => region === 'all' || p.code === region);
  
  if (sort === 'price') pkgs.sort((a,b) => a.price_total - b.price_total);
  if (sort === 'date') pkgs.sort((a,b) => new Date(a.depart_date) - new Date(b.depart_date));
  if (sort === 'rating') pkgs.sort((a,b) => b.user_rating - a.user_rating);
  
  let html = '';
  for(const p of pkgs) {
    const aiTag = p.amenities.includes("All-Inclusive") ? '<div class="tag-ai">All-Inclusive</div>' : '';
    
    html += `
      <a href="${p.url}" target="_blank" class="card">
        <div class="card-img">${aiTag}</div>
        <div class="card-body">
          <div class="region">${p.region}</div>
          <h2 class="resort">${p.resort}</h2>
          <div class="stars">${renderStars(p.stars)} <span style="color:#6b7385; font-size:12px; letter-spacing:0">(${p.user_rating}/10)</span></div>
          
          <div class="details">
            <div>✈️ ${p.airline} · ${p.depart_date} to ${p.return_date}</div>
            <div>⏱️ ${p.days} nights</div>
            <div>🌴 ${p.amenities.filter(a => a !== 'All-Inclusive').join(" · ")}</div>
          </div>
        </div>
        <div class="card-footer">
          <div>
            <div class="price">$\${p.price_total.toLocaleString()}</div>
            <div class="price-sub">Total Party Price (2 Adults)</div>
          </div>
          <div class="provider">\${p.provider} ↗</div>
        </div>
      </a>
    `;
  }
  $('#grid').innerHTML = html || '<div style="padding:20px; color:#6b7385">No packages match these filters.</div>';
}

$('#sort').onchange = render;
$('#filter-region').onchange = render;

$('#last-updated').textContent = `Tracking 5-7 night all-inclusive packages out of DSM (Any Day). Last updated: ${new Date(DATA.generated).toLocaleString()}`;
render();
</script>
</body>
</html>
