name: Scrape and Deploy Resort Deals
on:
  schedule:
    - cron: '0 13,21 * * *'  # 8 AM and 4 PM Central Time
  workflow_dispatch:
    inputs:
      build_only:
        description: "Run in build-only mode (skip scraping)"
        type: boolean
        default: false

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          
      - run: pip install -r requirements.txt
      
      - name: Run Package Scraper
        if: ${{ !inputs.build_only }}
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: python src/package_scraper.py
        
      - name: Build Static Site
        run: |
          # If you have a build script or if package_scraper handles grid embedding, run it here.
          # For now, ensure site/index.html reads data/packages.json correctly.
          echo "Building site..."
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
