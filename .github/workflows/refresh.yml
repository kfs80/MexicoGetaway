name: Scrape and Deploy Resort Deals

on:
  schedule:
    # GitHub cron is UTC. 13:00/21:00 UTC = 8 AM/4 PM CDT, but 7 AM/3 PM CST
    # after daylight saving ends (Nov 1, 2026). Adjust if you care.
    - cron: '0 13,21 * * *'
  workflow_dispatch:
    inputs:
      build_only:
        description: "Build-only mode (skip scraping, redeploy current data)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Run Package Scraper
        if: ${{ !inputs.build_only }}
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: python src/package_scraper.py

      # A GitHub issue assigned to and mentioning you: GitHub emails you and pushes to the mobile app.
      # This runs BEFORE the data commit, so if it fails the alert is retried on the next run.
      - name: Send deal alert (GitHub issue)
        if: ${{ !inputs.build_only && hashFiles('alerts_out/alert.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          { echo "@$OWNER"; echo; cat alerts_out/alert.md; echo; echo "Full list: https://$OWNER.github.io/${GITHUB_REPOSITORY#*/}/"; } > alerts_out/body.md
          gh issue create --title "$(cat alerts_out/title.txt)" --body-file alerts_out/body.md --assignee "$OWNER"

      # Optional phone push through ntfy.sh: install the ntfy app, subscribe to a hard-to-guess topic,
      # and put the same topic in a repo secret named NTFY_TOPIC.
      - name: Send deal alert (ntfy push)
        if: ${{ !inputs.build_only && hashFiles('alerts_out/ntfy.txt') != '' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            curl -s -H "Title: $(cat alerts_out/title.txt)" -d @alerts_out/ntfy.txt "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
          fi

      - name: Upload scraper debug samples
        if: ${{ always() && hashFiles('debug/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug
          path: debug/
          retention-days: 7

      # Commits made with GITHUB_TOKEN do not trigger deploy.yml, so no double deploy.
      - name: Commit updated data
        if: ${{ !inputs.build_only }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update package data"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
